<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprint Point Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        body { max-width: 860px; }
        .table td, .table th { vertical-align: middle; }
        .points-badge { min-width: 2.5rem; }
    </style>
</head>
<body class="mx-auto p-3 p-md-4">
    <h1 class="h3 mb-1"><i class="fa-solid fa-layer-group me-2 text-info"></i>Sprint Planning Fibonacci Calculator</h1>
    <p class="text-body-secondary mb-4">Converts Fibonacci story points to approximate hours, with 1 point = half a working day.</p>

    <div class="row g-3 mb-3">
        <div class="col-sm-6">
            <label for="weeks" class="form-label"><i class="fa-regular fa-calendar me-1"></i>Sprint length (weeks)</label>
            <input type="number" class="form-control" id="weeks" min="1" step="1" value="2">
        </div>
        <div class="col-sm-6">
            <label for="hoursPerDay" class="form-label"><i class="fa-regular fa-clock me-1"></i>Hours per day</label>
            <input type="number" class="form-control" id="hoursPerDay" min="0.5" max="24" step="0.5" value="8">
        </div>
    </div>

    <div id="summary" class="alert alert-secondary py-2 mb-3"></div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Points</th>
                    <th>Approx. hours</th>
                    <th>Size</th>
                </tr>
            </thead>
            <tbody id="results"></tbody>
        </table>
    </div>

    <p class="small text-body-secondary mt-3">
        <i class="fa-solid fa-floppy-disk me-1"></i>Settings are saved in this browser's local storage, which does not expire.
        Assumes a 5-day work week.
    </p>

    <script src="app.js"></script>
</body>
</html>
